<article class="restaurant-card">
  <div class="restaurant-card-image">
    <img
      class="icon"
      [src]="restaurant()?.image_url"
      alt="{{ restaurant()?.name }}"
    />
  </div>
  <div class="restaurant-card-body">
    <div class="restaurant-card-header">
      <h3>{{ restaurant()?.name }}</h3>
      <div class="flex">
        <div class="restaurant-price-range">
          @for (item of priceRangeArray(); track $index) {
            <span>€</span>
          }
        </div>
        <div class="restaurant-rating-badge">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="icon"
          >
            <path
              d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
            />
          </svg>
          <span>{{ restaurant()?.rating }}</span>
        </div>
      </div>
    </div>
    <div class="restaurant-info">
      <div class="restaurant-cuisine-badge">
        <span>{{ restaurant()?.cuisine | titlecase }}</span>
      </div>
      <div class="restaurant-location">
        <svg
          svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon"
        >
          <path
            d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
          />
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <button
          class="light link-btn"
          (click)="
            openInMaps(restaurant()?.name + ' ' + restaurant()?.address!)
          "
        >
          {{ restaurant()?.address }}
        </button>
      </div>
    </div>

    <p class="restaurant-description">
      {{ restaurant()?.description }}
    </p>
    @if (hasAction()) {
      <div class="restaurant-rating-section">
        <p>Votre note</p>
        <div class="ratings flex">
          @for (note of [1, 2, 3, 4, 5]; track note) {
            <button
              class="icon"
              (click)="updateRating(note, restaurant()?.id!)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon {{
                  note <= restaurant()?.my_rating! ? 'filled' : ''
                }}"
              >
                <path
                  d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                ></path>
              </svg>
            </button>
          }
        </div>
      </div>
      <div class="restaurant-actions-section">
        <button
          class="light justify-self-end"
          routerLink="/restaurants/{{ restaurant()?.id }}"
        >
          Modifier le restaurant
        </button>
      </div>
    }
  </div>
</article>
