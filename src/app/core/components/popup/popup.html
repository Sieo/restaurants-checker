<div class="popup-overlay">
  <div class="popup-content">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="popup-buttons">
      <button class="primary" (click)="onAccept()">Confirmer</button>
      <button class="alert" (click)="onDeny()">Annuler</button>
    </div>
  </div>
</div>
