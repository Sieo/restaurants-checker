<header class="header">
  <div class="header-container">
    <div class="flex items-center gap-2">
      <h1 class="header-logo">
        <a class="no-style" routerLink="/"> Restaurant Ratings </a>
      </h1>
    </div>
    <div class="header-nav">
      @if (!isLoggedIn()) {
        <button class="btn-login" [routerLink]="['/login']">Login</button>
      }
    </div>
    @if (isLoggedIn()) {
      <div class="header-nav-mobile">
        <button class="no-style drawer-toggle" (click)="toggleMenu()">
          <span class="hamburger-icon">&#9776;</span>
        </button>
      </div>
    }
  </div>
  <app-nav-drawer
    [open]="isDrawerOpen()"
    (close)="closeDrawer()"
  ></app-nav-drawer>
</header>
